name: Client
# Приложение AstatVPN (apps/client): проверка кода и сборка установочных файлов.
on:
  push:
    branches: [main, 'build/windows-*']
    paths: ['apps/client/**', '.github/workflows/client.yml']
  pull_request:
    paths: ['apps/client/**', '.github/workflows/client.yml']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'
  GO_VERSION: '1.27.4'

defaults:
  run:
    working-directory: apps/client

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    if: ${{ !startsWith(github.ref, 'refs/heads/build/windows-') }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache: false }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Ядро Xray
        run: tool/build_core_android.sh
      - run: flutter pub get
      # Постоянный ключ подписи хранится в секретах репозитория. Без них APK подписан отладочным ключом.
      - name: Ключ подписи
        env:
          ASTAT_KEYSTORE_BASE64: ${{ secrets.ASTAT_KEYSTORE_BASE64 }}
          ASTAT_KEY_PROPERTIES: ${{ secrets.ASTAT_KEY_PROPERTIES }}
        run: |
          if [ -n "$ASTAT_KEYSTORE_BASE64" ] && [ -n "$ASTAT_KEY_PROPERTIES" ]; then
            mkdir -p "$HOME/.astatvpn"
            printf '%s' "$ASTAT_KEYSTORE_BASE64" | base64 -d > "$HOME/.astatvpn/astatvpn-release.jks"
            printf '%s\n' "$ASTAT_KEY_PROPERTIES" > "$HOME/.astatvpn/key.properties"
          else
            echo "::warning::Секреты с ключом подписи не заданы: APK подписан отладочным ключом"
          fi
      - name: Сборка APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: astatvpn-android
          path: apps/client/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache: false }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      # тесты службы на настоящей Windows: именованный канал, права доступа, единственность экземпляра
      - name: Тесты службы
        run: cd core && go vet ./... && go test ./...
      - name: Служба и ядро Xray
        env:
          ARCHS: amd64
        run: tool/build_core_windows.sh
      - run: flutter pub get
      - name: Сборка приложения
        run: flutter build windows --release
      - name: Установщик
        run: |
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" windows/installer/astatvpn.iss
      - uses: actions/upload-artifact@v4
        with:
          name: astatvpn-windows
          path: |
            apps/client/build/installer/*.exe
            apps/client/build/windows/x64/runner/Release/
          if-no-files-found: error

  # macOS: приложение со службой внутри, без аккаунта разработчика Apple. iOS: только проверка сборки
  # под симулятор; сборка для устройств требует платной программы Apple и делается на Mac вручную.
  apple:
    if: ${{ !startsWith(github.ref, 'refs/heads/build/windows-') }}
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache: false }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - name: Проверка службы
        working-directory: apps/client/core
        run: go vet ./... && go test ./...
      - name: Служба для macOS
        run: tool/build_core_macos.sh
      - run: flutter pub get
      - name: Сборка под macOS
        run: flutter build macos --release
      - name: Образ диска
        run: tool/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: astatvpn-macos
          path: apps/client/build/installer/AstatVPN.dmg
      - name: Ядро Xray для iOS
        run: tool/build_core_apple.sh
      - name: Сборка под симулятор iOS
        run: flutter build ios --simulator --debug
